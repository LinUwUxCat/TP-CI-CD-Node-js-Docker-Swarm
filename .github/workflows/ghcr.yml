name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Docker TLS
        run: |
          mkdir -p ~/.docker
          echo "${{ secrets.DOCKER_CA_CERT }}" > ~/.docker/ca.pem
          echo "${{ secrets.DOCKER_CLIENT_CERT }}" > ~/.docker/cert.pem
          echo "${{ secrets.DOCKER_CLIENT_KEY }}" > ~/.docker/key.pem
          chmod 600 ~/.docker/*
      
      - name: Set Docker host
        run: |
          echo "DOCKER_HOST=${{ secrets.DOCKER_HOST }}" >> $GITHUB_ENV
          echo "DOCKER_TLS_VERIFY=1" >> $GITHUB_ENV